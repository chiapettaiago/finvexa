{% extends 'base.html' %}{% block content %}<div class="form-card"><h1>{{ 'Editar lançamento' if entry else 'Novo lançamento' }}</h1><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Descrição<input name="description" maxlength="150" required value="{{ entry.description if entry else '' }}"></label><div class="form-grid"><label>Tipo<select name="kind"><option value="despesa" {{ 'selected' if not entry or entry.kind == 'despesa' }}>Despesa</option><option value="receita" {{ 'selected' if entry and entry.kind == 'receita' }}>Receita</option></select></label><label>Mês de referência<input type="month" name="month" required value="{{ entry.month.strftime('%Y-%m') if entry else today.strftime('%Y-%m') }}"></label><label>Vencimento<input type="date" name="due" value="{{ entry.due.strftime('%Y-%m-%d') if entry and entry.due else '' }}"></label><label>Valor (R$)<input type="number" name="amount" min="0" step="0.01" required value="{{ entry.amount if entry else '' }}"></label></div><label class="check"><input type="checkbox" name="paid" {{ 'checked' if entry and entry.paid }}> Já foi pago/recebido</label>{% if not entry %}<label>Repetir por <select name="repeat"><option value="never">Nunca</option>{% for n in range(1, 13) %}<option value="{{ n }}">{{ n }} {{ 'mês' if n == 1 else 'meses' }}</option>{% endfor %}</select></label>{% endif %}<div class="form-actions"><a href="{{ url_for('index') }}">Cancelar</a><button>Salvar lançamento</button></div></form></div>{% endblock %}
