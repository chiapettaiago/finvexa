{% extends 'base.html' %}{% block content %}<div class="form-card"><h1>Importar planilha Excel</h1><p>Envie uma planilha <code>.xlsx</code>. Lançamentos idênticos já existentes são ignorados.</p><p><a href="{{ url_for('model') }}">Baixar modelo de importação</a></p><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Arquivo<input type="file" name="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" required></label><label>Ano do arquivo original (para o formato visual da imagem)<input type="number" name="year" min="1900" max="2100" value="{{ today.year }}" required></label><div class="form-actions"><a href="{{ url_for('index') }}">Cancelar</a><button>Importar</button></div></form></div>{% endblock %}
